name: Publish Docker Images

on:
  push:
    branches:
      - main
    # Only run the workflow if files in these directories are changed
    paths:
      - 'sentri-core/**'
      - 'sentri-client/**'
      - '.github/workflows/docker-publish.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend (sentri-core)
        uses: docker/build-push-action@v5
        with:
          context: ./sentri-core
          file: ./sentri-core/Dockerfile
          push: true
          tags: gokulajith/sentri-core:latest
          cache-from: type=registry,ref=gokulajith/sentri-core:buildcache
          cache-to: type=registry,ref=gokulajith/sentri-core:buildcache,mode=max

      - name: Build and Push Frontend (sentri-client)
        uses: docker/build-push-action@v5
        with:
          context: ./sentri-client
          file: ./sentri-client/Dockerfile
          push: true
          tags: gokulajith/sentri-client:latest
          cache-from: type=registry,ref=gokulajith/sentri-client:buildcache
          cache-to: type=registry,ref=gokulajith/sentri-client:buildcache,mode=max
